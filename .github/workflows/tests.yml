# Pruebas automaticas en cada push y en cada pull request.
# Si algo falla, el commit sale con una cruz roja en GitHub. Vercel publica
# igualmente (no depende de esto): la cruz es el aviso para revisar o revertir.
name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de prueba
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Sintaxis de los scripts
        run: for f in js/*.js i18n.js finance.js sw.js api/cg.js; do node --check "$f"; done

      - name: Calculos financieros (Vitest)
        run: npx vitest run

      - name: Instalar Chromium
        run: npx playwright-core install --with-deps chromium

      - name: App completa en navegador (375 y 320 px)
        run: npm run test:e2e
